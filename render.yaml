services:
  # Un solo servicio: la API .NET sirve también el frontend Angular (ver Dockerfile en la raíz).
  - type: web
    name: cashpyme-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Cadena de conexión al pooler de Supabase (Connect -> Session pooler).
      # Se pide al crear el Blueprint porque es secreta y no vive en el repo.
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Issuer
        value: CashPyme
      - key: Jwt__Audience
        value: CashPymeClient
      # Clave de firma JWT: Render genera un valor aleatorio seguro al crear el servicio.
      - key: Jwt__Key
        generateValue: true
      # El navegador ya no necesita CORS (front y API comparten origen). Se deja el origen
      # propio en el primer lugar; los otros dos de appsettings.json (https://localhost y
      # capacitor://localhost) son los de la app móvil en Android e iOS (mobile/).
      - key: Cors__AllowedOrigins__0
        value: https://cashpyme-backend.onrender.com
      # Base de los enlaces de los correos (verificar email, restablecer contraseña).
      - key: App__FrontendUrl
        value: https://cashpyme-backend.onrender.com
      - key: Email__From
        value: "CashPyme <onboarding@resend.dev>"
      # Opcional: sin esta key los correos solo se escriben en el log (ver README).
      - key: Email__ResendApiKey
        sync: false
      - key: Notificaciones__Habilitado
        value: "false"
